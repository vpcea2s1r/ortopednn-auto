backend:
  name: github
  repo: vpcea2s1r/ortopednn-auto
  branch: master
  base_url: https://admin.ortopednn.ru
  auth_endpoint: auth
publish_mode: editorial_workflow
media_folder: public/images
public_folder: /images
collections:
  - name: blog
    label: Статьи
    label_singular: Статья
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    preview_path: blog/{{slug}}
    fields:
      - { label: Заголовок, name: title, widget: string }
      - { label: Описание, name: description, widget: string }
      - { label: Slug, name: slug, hint: 'Часть URL (например: vybor-zubnogo-proteza)', pattern: ['^[a-z0-9-]+$', 'Только латиница, цифры и дефисы'] }
      - { label: Категория, name: category, widget: select, options: [protezirovanie, implanty, lechenie, gospitalizaciya, obzory, uhod, stomatologiya] }
      - { label: Дата, name: date, widget: datetime, format: YYYY-MM-DD }
      - { label: Изображение, name: image, widget: image, required: false }
      - { label: Содержание, name: body, widget: markdown }
