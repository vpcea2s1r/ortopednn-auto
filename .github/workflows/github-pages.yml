name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: IndexNow
        run: |
          python3 - <<'PY'
          import json, re, urllib.request

          xml = open('dist/sitemap-0.xml', encoding='utf-8').read()
          urls = re.findall(r'<loc>(.*?)</loc>', xml)
          key = 'db2a3c9dfc354341aa8294c9915624ec'
          payload = {
            'host': 'ortopednn.ru',
            'key': key,
            'keyLocation': f'https://ortopednn.ru/{key}.txt',
            'urlList': urls,
          }
          req = urllib.request.Request(
            'https://api.indexnow.org/indexnow',
            data=json.dumps(payload).encode('utf-8'),
            headers={'Content-Type': 'application/json; charset=utf-8'},
            method='POST',
          )
          try:
            with urllib.request.urlopen(req, timeout=30) as resp:
              print('IndexNow:', resp.status, len(urls), 'URLs')
          except urllib.error.HTTPError as e:
            print('IndexNow HTTP', e.code, e.read().decode('utf-8', 'ignore'))
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4