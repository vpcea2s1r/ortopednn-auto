name: Link check

on:
  push:
    paths: ['src/content/**', 'src/pages/**', 'src/components/**', 'data/**']
  schedule: [{ cron: '0 6 * * 1' }]
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress
            --exclude 'mailto:'
            --exclude '^https://t\.me'
            --exclude 'http://localhost'
            --exclude 'http://127\.0\.0\.1'
            './src/**/*.md' './src/**/*.astro'
          fail: true
